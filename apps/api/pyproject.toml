[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "psycopg2-binary>=2.9",
    "djangorestframework-simplejwt>=5.3",
    "django-redis>=5.4",
    "celery>=5.4",
    "redis>=5.0",
    "drf-spectacular>=0.27",
    "drf-pydantic>=2.0",
    "pydantic[email]>=2.0",
]

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "black>=24.0",
]

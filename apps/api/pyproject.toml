[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "psycopg2-binary>=2.9",
]

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "black>=24.0",
]
